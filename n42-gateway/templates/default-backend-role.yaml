{{- if and .Values.defaultBackend.enabled .Values.rbac.security.enable (semverCompare "< 1.25-0" .Capabilities.KubeVersion.Version) }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    {{- include "n42-gateway.labels" . | nindent 4 }}
  name: {{ include "n42-gateway.defaultBackend.fullname" . }}
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups:
      - policy
    resources:
      - podsecuritypolicies
    resourceNames:
      - {{ include "n42-gateway.defaultBackend.fullname" . }}
    verbs:
      - use
{{- end }}
