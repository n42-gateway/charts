{{- if .Values.controller.tcp -}}
apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    {{- include "n42-gateway.labels" . | nindent 4 }}
  name: {{ include "n42-gateway.fullname" . }}-tcp
  namespace: {{ .Release.Namespace }}
data:
{{- range $key, $value := .Values.controller.tcp }}
  {{ tpl $key $ | quote }}: {{ tpl $value $ | quote }}
{{- end }}
{{- end }}
