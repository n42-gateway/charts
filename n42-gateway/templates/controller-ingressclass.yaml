{{- if .Values.controller.ingressClassResource.enabled }}
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  labels:
    {{- include "n42-gateway.labels" . | nindent 4 }}
  name: {{ .Values.controller.ingressClass }}
{{- if .Values.controller.ingressClassResource.default }}
  annotations:
    ingressclass.kubernetes.io/is-default-class: "true"
{{- end }}
spec:
  controller: {{ include "n42-gateway.controller-name" . }}
{{- with .Values.controller.ingressClassResource.parameters }}
  parameters:
    {{- toYaml . | nindent 4 }}
{{- end }}
{{- end }}
